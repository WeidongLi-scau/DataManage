services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-teaminfo}
      POSTGRES_USER: ${DATABASE_USER:-teaminfo}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - ${HOST_DATA_ROOT:-/srv/teaminfo/data}/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [backend]

  meilisearch:
    image: getmeili/meilisearch:v1.56.2
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY in .env}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - ${HOST_DATA_ROOT:-/srv/teaminfo/data}/meilisearch:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_ENGINE: postgres
      DATABASE_HOST: db
      REDIS_URL: redis://redis:6379/0
      MEILI_URL: http://meilisearch:7700
      DATA_ROOT: /app/data
    command: >
      sh -c "python manage.py migrate --noinput &&
      python manage.py configure_search &&
      python manage.py collectstatic --noinput &&
      exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 180"
    volumes:
      - ${HOST_DATA_ROOT:-/srv/teaminfo/data}/files:/app/data/files
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [backend]

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_ENGINE: postgres
      DATABASE_HOST: db
      REDIS_URL: redis://redis:6379/0
      MEILI_URL: http://meilisearch:7700
      DATA_ROOT: /app/data
    command: ["python", "manage.py", "rqworker", "default"]
    volumes:
      - ${HOST_DATA_ROOT:-/srv/teaminfo/data}/files:/app/data/files
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks: [backend]

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${LAN_BIND_IP:-127.0.0.1}:8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/srv/static:ro
    depends_on:
      web:
        condition: service_healthy
    networks: [backend, edge]

networks:
  backend:
    driver: bridge
    internal: true
  edge:
    driver: bridge

volumes:
  redis_data:
  static_data:


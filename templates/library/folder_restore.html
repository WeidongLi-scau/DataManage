{% extends 'library/base.html' %}{% block title %}恢复文件夹{% endblock %}{% block content %}<div class="page-heading"><div><h1>恢复文件夹</h1><p>{{ folder.group.name }} / {{ folder.name }}</p></div></div><section class="manage-panel account-credentials">{% if error %}<p class="alert error" role="alert">{{ error }}</p>{% endif %}<form method="post" class="manage-form">{% csrf_token %}<label for="restore-name">恢复名称</label><input id="restore-name" name="name" required maxlength="160" value="{{ folder.name }}"><label for="restore-parent">恢复到</label><select id="restore-parent" name="parent"><option value="">项目根目录</option>{% for target in targets %}<option value="{{ target.pk }}" {% if target.pk == folder.parent_id %}selected{% endif %}>{{ target.display_path }}</option>{% endfor %}</select><p>恢复原有层级和本批次一起删除的文件；此前已删除的文件继续留在回收站。</p><div class="form-actions"><a href="{% url 'recycle_bin' %}" class="button ghost">取消</a><button class="button primary" type="submit">确认恢复文件夹</button></div></form></section>{% endblock %}
